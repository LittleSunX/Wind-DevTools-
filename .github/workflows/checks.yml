name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: |
          npm run preview > /tmp/wind-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173/tools > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:code-image
          npm run test:compat
          npm run test:sidebar
          npm run test:i18n
        env:
          PW_CHANNEL: bundled
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-artifacts
          path: artifacts/
